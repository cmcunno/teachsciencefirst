<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Level Food Tests Virtual Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      
      /* Tab Animations */
      .tab-indicator {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Liquid Animations */
      .liquid-base {
        transition: fill 1.5s ease-in-out;
      }

      /* Specific Chemical Reactions */
      @keyframes glucoseReaction {
        0% { fill: #3b82f6; }   /* Blue */
        30% { fill: #22c55e; }  /* Green */
        60% { fill: #eab308; }  /* Yellow/Orange */
        100% { fill: #dc2626; } /* Brick Red */
      }
      
      .animate-glucose {
        animation: glucoseReaction 4s forwards ease-in-out;
      }

      @keyframes lipidsReaction {
        0% { fill: #e2e8f0; opacity: 0.9; }
        100% { fill: #f8fafc; opacity: 0.95; filter: url(#cloudy); }
      }

      .animate-lipids {
        animation: lipidsReaction 2s forwards ease-in-out;
      }

      /* UI Elements */
      .fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .slide-up {
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Maximize / Modal Classes */
      .maximized {
        position: fixed !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        width: 95vw !important;
        max-width: 1100px !important; /* Centralised and consistent width */
        height: 85vh !important;
        z-index: 9999 !important;
        border-radius: 16px !important;
        margin: 0 !important;
        background-color: white !important;
        display: flex !important;
        flex-direction: column !important;
        /* Backdrop overlay using huge shadow */
        box-shadow: 0 0 0 100vmax rgba(15, 23, 42, 0.75), 0 20px 25px -5px rgba(0, 0, 0, 0.1) !important;
        border: 1px solid #e2e8f0 !important;
        animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
      }

      @keyframes modalPop {
        0% { opacity: 0; transform: translate(-50%, -45%) scale(0.95); }
        100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      }

      .maximized .hide-on-maximize {
        display: none !important;
      }

      .maximized .maximize-btn-icon {
        display: none !important;
      }
      
      .maximized .minimize-btn-icon {
        display: block !important;
      }

      /* Specific scrolling behavior for different card types */
      #card-procedure.maximized {
        overflow-y: auto !important;
        padding: 2.5rem !important;
      }

      #card-simulation.maximized, #card-results.maximized {
        overflow: hidden !important;
        padding: 0 !important;
      }

      /* Hide minimize icon by default */
      .minimize-btn-icon {
        display: none;
      }

      /* Table Styles */
      .results-input {
        width: 100%;
        background: transparent;
        border: 1px solid transparent;
        padding: 4px;
        border-radius: 4px;
        transition: all 0.2s;
      }
      .results-input:focus {
        background: white;
        border-color: #6366f1;
        outline: none;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
      }
      .results-select {
        background: transparent;
        border: none;
        font-weight: 600;
        cursor: pointer;
        border-radius: 4px;
        padding: 2px;
      }
      .results-select:focus {
        outline: none;
        background: rgba(255,255,255,0.5);
      }

      /* Print Styles */
      #print-area { display: none; }

      @media print {
        @page {
            size: A4 portrait;
            margin: 0.5cm;
        }
        
        body { 
            background-color: white; 
            print-color-adjust: exact; 
            -webkit-print-color-adjust: exact;
        }

        /* Hide App Interface */
        header, #app, .modal-controls { 
            display: none !important; 
        }

        /* Show Print Area */
        #print-area { 
            display: block !important; 
            font-family: 'Times New Roman', serif;
        }

        .print-container {
            margin-bottom: 1cm;
        }

        .print-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid black;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .print-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px; /* Smaller font for A-Level table with more columns */
        }

        .print-table th, .print-table td {
            border: 1px solid #333;
            padding: 4px;
            text-align: left;
            vertical-align: top;
        }

        .print-table th {
            background-color: #f0f0f0 !important;
            font-weight: bold;
        }

        .cut-line {
            border-top: 1px dashed #999;
            margin: 1cm 0;
            position: relative;
            text-align: center;
        }
        
        .cut-line::after {
            content: '✂';
            position: absolute;
            top: -12px;
            left: 50%;
            background: white;
            padding: 0 5px;
            color: #666;
        }
      }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="min-h-screen flex flex-col text-slate-900 bg-slate-50">
    
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="bg-indigo-600 p-2 rounded-lg shadow-md">
              <i data-lucide="flask-conical" class="text-white w-6 h-6"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">A-Level BioLab <span class="text-slate-400 font-light">| Food Tests</span></h1>
          </div>
          <div class="hidden md:block text-sm text-slate-500 font-medium bg-slate-100 px-3 py-1 rounded-full">
            Interactive Study Guide
          </div>
        </div>
        
        <!-- Tab Navigation Bar -->
        <div class="border-t border-slate-100 bg-white">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                <nav class="flex space-x-6 overflow-x-auto no-scrollbar" aria-label="Tabs" id="tab-container">
                    <!-- Tabs injected by JS -->
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app" class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1">
        <!-- Content injected by JS -->
    </main>

    <!-- Hidden Print Area -->
    <div id="print-area"></div>

    <script>
        // --- CONFIGURATION DATA ---
        const TESTS = {
            'Starch': {
                id: 'Starch',
                title: "Test for Starch",
                reagent: "Iodine Solution",
                reagentColor: "#d97706", // Amber
                procedure: [
                    "Place a small sample of the food on a spotting tile.",
                    "Add a few drops of Iodine solution.",
                    "Observe the color change immediately."
                ],
                positiveResult: { description: "Blue-Black", colorHex: "#0f172a", appearance: "Turns deep blue-black." },
                negativeResult: { description: "Orange-Brown", colorHex: "#d97706", appearance: "Stays orange-brown." },
                safety: "Wear goggles. Iodine is an irritant and can stain clothes/skin.",
                icon: "🥔",
                gradient: "from-amber-50 to-amber-100",
                animationClass: "duration-1000" 
            },
            'ReducingSugar': {
                id: 'ReducingSugar',
                title: "Test for Reducing Sugars",
                reagent: "Benedict's Solution",
                reagentColor: "#3b82f6", // Blue
                procedure: [
                    "Add food sample to a test tube.",
                    "Add equal volume of Benedict's solution.",
                    "Heat in a boiling water bath (>80°C) for 5 mins.",
                    "Observe color change."
                ],
                positiveResult: { description: "Brick Red", colorHex: "#dc2626", appearance: "Blue -> Green -> Yellow -> Brick Red precipitate." },
                negativeResult: { description: "Blue", colorHex: "#3b82f6", appearance: "Remains blue." },
                safety: "Wear goggles. Boiling water bath presents a scald hazard.",
                icon: "🍭",
                gradient: "from-blue-50 to-red-50",
                animationClass: "animate-glucose", 
                requiresHeat: true
            },
            'NonReducingSugar': {
                id: 'NonReducingSugar',
                title: "Test for Non-Reducing Sugars",
                reagent: "HCl, NaHCO₃, Benedict's",
                reagentColor: "#3b82f6", // Blue (End stage)
                procedure: [
                    "Confirm negative result for reducing sugar first.",
                    "Add dilute Hydrochloric Acid (HCl) and boil.",
                    "Neutralize with Sodium Hydrogen Carbonate.",
                    "Retest with Benedict's solution and heat."
                ],
                positiveResult: { description: "Brick Red", colorHex: "#dc2626", appearance: "Turns red after hydrolysis (was blue before)." },
                negativeResult: { description: "Blue", colorHex: "#3b82f6", appearance: "Remains blue even after hydrolysis." },
                safety: "HCl is corrosive. Wear goggles. Boiling acid is hazardous.",
                icon: "🍬",
                gradient: "from-cyan-50 to-blue-100",
                animationClass: "animate-glucose", 
                requiresHeat: true,
                isComplex: true
            },
            'Lipids': {
                id: 'Lipids',
                title: "Test for Lipids (Emulsion)",
                reagent: "Ethanol & Water",
                reagentColor: "#e2e8f0", // Light grey/clear
                procedure: [
                    "Add food sample to a test tube.",
                    "Add Ethanol and shake vigorously to dissolve lipid.",
                    "Pour the solution into a tube containing cold water.",
                    "Look for a white emulsion layer forming on top."
                ],
                positiveResult: { description: "Cloudy White", colorHex: "#f1f5f9", appearance: "A milky white emulsion forms." },
                negativeResult: { description: "Colorless", colorHex: "#bae6fd", appearance: "Solution remains clear." },
                safety: "Ethanol is highly flammable. Keep away from flames.",
                icon: "🥑",
                gradient: "from-slate-100 to-slate-200",
                animationClass: "animate-lipids"
            },
            'Protein': {
                id: 'Protein',
                title: "Test for Proteins",
                reagent: "Biuret Reagent",
                reagentColor: "#60a5fa", // Light Blue
                procedure: [
                    "Add food sample to a test tube.",
                    "Add a few drops of Biuret reagent.",
                    "Shake gently to mix.",
                    "Observe color change."
                ],
                positiveResult: { description: "Purple / Lilac", colorHex: "#a855f7", appearance: "Turns from blue to purple/lilac." },
                negativeResult: { description: "Blue", colorHex: "#60a5fa", appearance: "Remains blue." },
                safety: "Biuret contains NaOH (Corrosive). Wear goggles.",
                icon: "🥩",
                gradient: "from-blue-50 to-violet-100",
                animationClass: "duration-[2000ms]"
            }
        };

        // --- STATE MANAGEMENT ---
        let state = {
            activeTab: 'Starch',
            isTesting: false,
            isComplete: false,
            resultsData: [
                { food: '', starch: { obs: '', res: '-' }, reducingSugar: { obs: '', res: '-' }, nonReducingSugar: { obs: '', res: '-' }, lipids: { obs: '', res: '-' }, protein: { obs: '', res: '-' } },
                { food: '', starch: { obs: '', res: '-' }, reducingSugar: { obs: '', res: '-' }, nonReducingSugar: { obs: '', res: '-' }, lipids: { obs: '', res: '-' }, protein: { obs: '', res: '-' } },
                { food: '', starch: { obs: '', res: '-' }, reducingSugar: { obs: '', res: '-' }, nonReducingSugar: { obs: '', res: '-' }, lipids: { obs: '', res: '-' }, protein: { obs: '', res: '-' } },
                { food: '', starch: { obs: '', res: '-' }, reducingSugar: { obs: '', res: '-' }, nonReducingSugar: { obs: '', res: '-' }, lipids: { obs: '', res: '-' }, protein: { obs: '', res: '-' } },
                { food: '', starch: { obs: '', res: '-' }, reducingSugar: { obs: '', res: '-' }, nonReducingSugar: { obs: '', res: '-' }, lipids: { obs: '', res: '-' }, protein: { obs: '', res: '-' } }
            ]
        };

        // --- DOM MANIPULATION ---
        
        function init() {
            renderTabs();
            renderContent();
        }

        function setActiveTab(tabId) {
            if (state.isTesting) return; // Prevent switching while animating
            state.activeTab = tabId;
            state.isTesting = false;
            state.isComplete = false;
            renderTabs();
            renderContent();
        }

        function renderTabs() {
            const container = document.getElementById('tab-container');
            const testTabs = Object.values(TESTS).map(t => renderTabButton(t.id, t.icon)).join('');
            const resultsTab = renderTabButton('Results', '📊'); 

            container.innerHTML = testTabs + resultsTab;
        }

        function renderTabButton(id, icon) {
            const isActive = id === state.activeTab;
            // Simplify labels for tabs to save space
            const label = id === 'ReducingSugar' ? 'Red. Sugar' : 
                          id === 'NonReducingSugar' ? 'Non-Red. Sugar' : 
                          id;
            
            return `
                <button 
                    onclick="setActiveTab('${id}')"
                    class="group inline-flex items-center py-4 px-2 border-b-2 font-medium text-sm transition-colors duration-200 whitespace-nowrap ${
                        isActive 
                        ? 'border-indigo-500 text-indigo-600' 
                        : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                    }"
                >
                    <span class="mr-2 text-lg opacity-80 group-hover:opacity-100 transition-opacity">${icon}</span>
                    ${label}
                </button>
            `;
        }

        function toggleMaximize(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.toggle('maximized');
            }
        }

        function renderContent() {
            const app = document.getElementById('app');
            
            // --- RENDER RESULTS TABLE TAB ---
            if (state.activeTab === 'Results') {
                renderResultsTable(app);
                lucide.createIcons();
                return;
            }

            // --- RENDER STANDARD TEST TABS ---
            const config = TESTS[state.activeTab];
            
            // Generate Procedure Steps
            const procedureHtml = config.procedure.map((step, i) => `
                <li class="flex gap-4 items-start group">
                    <span class="flex-shrink-0 w-7 h-7 rounded-full bg-indigo-50 text-indigo-600 font-bold text-sm flex items-center justify-center mt-0.5 border border-indigo-100 group-hover:bg-indigo-600 group-hover:text-white transition-colors">${i+1}</span>
                    <p class="text-slate-600 text-sm leading-relaxed group-hover:text-slate-900 transition-colors">${step}</p>
                </li>
            `).join('');

            app.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 fade-in">
                    
                    <!-- LEFT: Information & Theory -->
                    <div class="lg:col-span-7 space-y-6">
                        
                        <!-- Header Card -->
                        <div class="rounded-2xl p-8 bg-gradient-to-br ${config.gradient} shadow-sm border border-white/50 relative overflow-hidden slide-up">
                            <div class="relative z-10">
                                <h2 class="text-3xl font-extrabold text-slate-800 mb-2 tracking-tight">${config.title}</h2>
                                <div class="flex flex-wrap gap-2 mt-3">
                                    <span class="inline-flex items-center gap-1.5 bg-white/60 backdrop-blur-sm px-3 py-1.5 rounded-full text-sm font-semibold text-slate-700 shadow-sm border border-white/20">
                                        <i data-lucide="flask-conical" class="w-4 h-4 text-indigo-600"></i> ${config.reagent}
                                    </span>
                                    <span class="inline-flex items-center gap-1.5 bg-white/60 backdrop-blur-sm px-3 py-1.5 rounded-full text-sm font-semibold text-slate-700 shadow-sm border border-white/20">
                                        <i data-lucide="palette" class="w-4 h-4 text-indigo-600"></i> Start: <span class="w-3 h-3 rounded-full inline-block ml-1" style="background-color: ${config.reagentColor}"></span>
                                    </span>
                                </div>
                            </div>
                            <div class="absolute -right-6 -bottom-6 w-40 h-40 bg-white/40 rounded-full blur-3xl"></div>
                        </div>

                        <!-- Method (Modal Capable) -->
                        <div id="card-procedure" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 slide-up relative transition-all" style="animation-delay: 100ms">
                            <!-- Modal Controls -->
                            <button onclick="toggleMaximize('card-procedure')" class="absolute top-4 right-4 p-2 hover:bg-slate-100 rounded-full text-slate-400 hover:text-indigo-600 transition-colors z-20">
                                <i data-lucide="maximize-2" class="w-5 h-5 maximize-btn-icon"></i>
                                <i data-lucide="x" class="w-6 h-6 minimize-btn-icon"></i>
                            </button>

                            <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2 border-b border-slate-100 pb-3 pr-10">
                                <i data-lucide="clipboard-list" class="text-indigo-600"></i> Standard Procedure
                            </h3>
                            <ul class="space-y-4">
                                ${procedureHtml}
                            </ul>
                        </div>

                        <!-- Results Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 slide-up" style="animation-delay: 200ms">
                            <!-- Positive -->
                            <div class="bg-green-50/50 rounded-xl p-5 border border-green-100 hover:border-green-200 transition-colors">
                                <div class="flex items-center gap-2 text-green-700 font-bold mb-3">
                                    <i data-lucide="check-circle-2" class="w-5 h-5"></i> Positive Result
                                </div>
                                <div class="flex items-center gap-3 mb-3 bg-white p-2 rounded-lg border border-green-100 shadow-sm">
                                    <div class="w-8 h-8 rounded-full shadow-inner border border-slate-100" style="background-color: ${config.positiveResult.colorHex}"></div>
                                    <span class="font-bold text-slate-800">${config.positiveResult.description}</span>
                                </div>
                                <p class="text-sm text-slate-600 leading-snug">${config.positiveResult.appearance}</p>
                            </div>

                            <!-- Negative -->
                            <div class="bg-slate-50 rounded-xl p-5 border border-slate-200 hover:border-slate-300 transition-colors">
                                <div class="flex items-center gap-2 text-slate-500 font-bold mb-3">
                                    <i data-lucide="x-circle" class="w-5 h-5"></i> Negative Result
                                </div>
                                <div class="flex items-center gap-3 mb-3 bg-white p-2 rounded-lg border border-slate-200 shadow-sm">
                                    <div class="w-8 h-8 rounded-full shadow-inner border border-slate-100" style="background-color: ${config.negativeResult.colorHex}"></div>
                                    <span class="font-bold text-slate-700">${config.negativeResult.description}</span>
                                </div>
                                <p class="text-sm text-slate-500 leading-snug">${config.negativeResult.appearance}</p>
                            </div>
                        </div>
                        
                         <!-- Safety -->
                        <div class="bg-orange-50 rounded-xl p-4 border border-orange-200 flex items-start gap-3 slide-up" style="animation-delay: 300ms">
                            <div class="bg-orange-100 p-2 rounded-full text-orange-600 mt-0.5">
                                <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="text-sm font-bold text-orange-900">Safety Precautions</h4>
                                <p class="text-sm text-orange-800 mt-1">${config.safety}</p>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT: Interactive Simulation (Modal Capable) -->
                    <div class="lg:col-span-5 space-y-6">
                        <div id="card-simulation" class="bg-white rounded-2xl shadow-xl border border-slate-200 sticky top-24 overflow-hidden flex flex-col min-h-[600px] relative transition-all">
                            
                            <!-- Modal Controls -->
                            <button onclick="toggleMaximize('card-simulation')" class="absolute top-3 right-3 p-2 hover:bg-slate-100 rounded-full text-slate-400 hover:text-indigo-600 transition-colors z-30">
                                <i data-lucide="maximize-2" class="w-5 h-5 maximize-btn-icon"></i>
                                <i data-lucide="x" class="w-6 h-6 minimize-btn-icon"></i>
                            </button>

                            <!-- Sim Header -->
                            <div class="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                                <h3 class="font-bold text-slate-700 flex items-center gap-2">
                                    <i data-lucide="play-circle" class="w-5 h-5 text-indigo-500"></i> Simulation
                                </h3>
                                <div class="text-xs font-mono text-slate-400 uppercase tracking-wide pr-8">A-Level Virtual Lab</div>
                            </div>

                            <!-- Sim Canvas -->
                            <div class="flex-1 relative bg-gradient-to-b from-slate-50 to-white flex flex-col items-center justify-end pb-28 pt-8">
                                
                                <!-- Status Overlay -->
                                <div id="sim-status" class="absolute top-6 left-0 right-0 text-center pointer-events-none transition-opacity duration-300 opacity-0">
                                     <span class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-indigo-600 text-white text-sm font-bold shadow-lg">
                                        <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                                        <span id="status-text">Processing...</span>
                                     </span>
                                </div>

                                <!-- Heat Source (Hidden by default) -->
                                <div id="heat-source" class="absolute bottom-10 left-1/2 -translate-x-1/2 opacity-0 transition-all duration-500 transform translate-y-12 flex flex-col items-center">
                                    <div class="relative">
                                        <i data-lucide="flame" class="w-12 h-12 text-orange-500 animate-bounce"></i>
                                        <div class="absolute inset-0 bg-orange-400 blur-xl opacity-50 animate-pulse"></div>
                                    </div>
                                    <span class="text-orange-600 font-bold text-xs mt-2 bg-orange-100 px-2 py-1 rounded">Heat Source On</span>
                                </div>

                                <!-- Test Tube SVG -->
                                <svg viewBox="0 0 100 200" class="w-48 h-80 drop-shadow-2xl z-10 transition-transform duration-500 hover:scale-105" xmlns="http://www.w3.org/2000/svg">
                                    <defs>
                                        <filter id="cloudy">
                                            <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="3" result="noise" />
                                            <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" />
                                            <feGaussianBlur stdDeviation="1" />
                                        </filter>
                                        <linearGradient id="glass-shine" x1="0%" y1="0%" x2="100%" y2="0%">
                                            <stop offset="0%" stop-color="white" stop-opacity="0.1"/>
                                            <stop offset="50%" stop-color="white" stop-opacity="0.4"/>
                                            <stop offset="100%" stop-color="white" stop-opacity="0.1"/>
                                        </linearGradient>
                                    </defs>
                                    
                                    <!-- Back of Tube -->
                                    <path d="M30,10 L30,170 A20,20 0 0,0 70,170 L70,10" fill="rgba(255,255,255,0.1)" stroke="#cbd5e1" stroke-width="1" />

                                    <!-- Liquid -->
                                    <path id="liquid" 
                                          d="M31,60 L31,170 A19,19 0 0,0 69,170 L69,60 Z" 
                                          fill="${config.reagentColor}" 
                                          class="liquid-base transition-all" />

                                    <!-- Front Glass Reflection -->
                                    <path d="M30,10 L30,170 A20,20 0 0,0 70,170 L70,10" fill="url(#glass-shine)" stroke="#94a3b8" stroke-width="2" class="opacity-50" />
                                    
                                    <!-- Highlight -->
                                    <path d="M35,60 L35,160 A10,10 0 0,0 40,160" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-opacity="0.4" />
                                </svg>

                                <!-- Result Badge -->
                                <div id="result-badge" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 opacity-0 transform scale-90 transition-all duration-500">
                                    <div class="bg-white/90 backdrop-blur-md border border-green-200 text-green-700 px-6 py-3 rounded-xl shadow-xl flex flex-col items-center gap-1">
                                        <i data-lucide="check-badge" class="w-8 h-8 text-green-600"></i>
                                        <span class="font-bold text-lg">Positive</span>
                                        <span class="text-xs text-green-800 uppercase tracking-wider font-semibold">Confirmed</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Controls -->
                            <div class="p-6 bg-white border-t border-slate-100 z-20">
                                <div class="flex gap-3">
                                    <button id="btn-test" onclick="runSimulation()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 rounded-xl shadow-lg shadow-indigo-200 transition-all active:scale-95 flex items-center justify-center gap-2 group">
                                        <i data-lucide="flask-conical" class="w-5 h-5 group-hover:rotate-12 transition-transform"></i>
                                        <span>Run Test Procedure</span>
                                    </button>
                                    
                                    <button onclick="resetSimulation()" class="px-6 bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium rounded-xl border border-slate-200 transition-colors" title="Reset Simulation">
                                        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                                    </button>
                                </div>
                                <p class="text-center text-slate-400 text-xs mt-4">
                                    Click to simulate the full experimental sequence
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            lucide.createIcons();
        }

        function safeValue(str) {
            if (str === null || str === undefined) return '';
            // Escape double quotes to prevent HTML breakage in input value attributes
            return String(str).replace(/"/g, '&quot;');
        }

        function renderResultsTable(container) {
            const rows = state.resultsData.map((row, index) => `
                <tr class="hover:bg-slate-50/80 transition-colors">
                    <td class="p-3 border-b border-slate-100">
                        <input 
                            type="text" 
                            value="${safeValue(row.food)}" 
                            placeholder="e.g. Sucrose" 
                            class="results-input bg-slate-50 font-medium text-slate-800"
                            oninput="updateResult(${index}, 'food', this.value)"
                        />
                    </td>
                    ${renderTestCell(index, 'starch', row.starch)}
                    ${renderTestCell(index, 'reducingSugar', row.reducingSugar)}
                    ${renderTestCell(index, 'nonReducingSugar', row.nonReducingSugar)}
                    ${renderTestCell(index, 'lipids', row.lipids)}
                    ${renderTestCell(index, 'protein', row.protein)}
                </tr>
            `).join('');

            container.innerHTML = `
                <div class="grid grid-cols-1 fade-in h-full">
                    <div id="card-results" class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden relative flex flex-col h-full transition-all">
                        
                        <!-- Modal Controls -->
                        <button onclick="toggleMaximize('card-results')" class="absolute top-4 right-4 p-2 hover:bg-slate-100 rounded-full text-slate-400 hover:text-indigo-600 transition-colors z-20">
                            <i data-lucide="maximize-2" class="w-5 h-5 maximize-btn-icon"></i>
                            <i data-lucide="x" class="w-6 h-6 minimize-btn-icon"></i>
                        </button>

                        <!-- Header -->
                        <div class="p-8 bg-gradient-to-r from-indigo-600 to-violet-600 text-white">
                            <h2 class="text-2xl font-bold flex items-center gap-3">
                                <i data-lucide="table-2" class="w-6 h-6 text-indigo-200"></i>
                                A-Level Results Log
                            </h2>
                            <p class="text-indigo-100 mt-2 max-w-2xl">
                                Record your observations. Note that Non-Reducing Sugar tests are usually only performed if the Reducing Sugar test is negative.
                            </p>
                        </div>

                        <!-- Table Container -->
                        <div class="overflow-x-auto p-6 flex-1">
                            <table class="w-full text-sm text-left text-slate-600 rounded-lg overflow-hidden border-collapse">
                                <thead class="text-xs text-slate-700 uppercase bg-slate-100 border-b border-slate-200">
                                    <tr>
                                        <th scope="col" class="px-4 py-3 min-w-[120px]">Food Sample</th>
                                        <th scope="col" class="px-4 py-3 min-w-[140px] bg-amber-50/50 text-amber-900">Starch (Iodine)</th>
                                        <th scope="col" class="px-4 py-3 min-w-[140px] bg-blue-50/50 text-blue-900">Reducing Sugar (Benedict's)</th>
                                        <th scope="col" class="px-4 py-3 min-w-[140px] bg-cyan-50/50 text-cyan-900">Non-Reducing Sugar (Hydrolysis)</th>
                                        <th scope="col" class="px-4 py-3 min-w-[140px] bg-slate-100 text-slate-900">Lipids (Ethanol)</th>
                                        <th scope="col" class="px-4 py-3 min-w-[140px] bg-purple-50/50 text-purple-900">Protein (Biuret)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 text-xs text-slate-500 flex justify-between items-center">
                            <span>* All entries are saved automatically as you type.</span>
                            <div class="flex gap-4">
                                <button onclick="fillSampleResults()" class="text-emerald-600 hover:text-emerald-800 font-bold flex items-center gap-1">
                                    <i data-lucide="wand-2" class="w-4 h-4"></i> Sample Data
                                </button>
                                <button onclick="printWorksheet()" class="text-indigo-600 hover:text-indigo-800 font-bold flex items-center gap-1">
                                    <i data-lucide="printer" class="w-4 h-4"></i> Print Worksheet
                                </button>
                                <button onclick="clearResults()" class="text-red-500 hover:text-red-700 font-medium flex items-center gap-1">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i> Clear Table
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTestCell(rowIndex, testKey, cellData) {
            // Colors for the result selector
            const posColor = testKey === 'starch' ? 'text-slate-900' 
                          : testKey === 'reducingSugar' ? 'text-red-600'
                          : testKey === 'nonReducingSugar' ? 'text-red-600'
                          : testKey === 'lipids' ? 'text-slate-600'
                          : 'text-purple-600';

            return `
                <td class="p-3 border-b border-slate-100 border-l border-slate-50 align-top">
                    <div class="flex flex-col gap-2">
                        <input 
                            type="text" 
                            value="${safeValue(cellData.obs)}" 
                            placeholder="Obs..." 
                            class="results-input text-xs"
                            oninput="updateResult(${rowIndex}, '${testKey}', this.value, 'obs')"
                        />
                        <div class="flex items-center gap-2 bg-slate-50 rounded px-2 py-1">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Res:</span>
                            <select 
                                onchange="updateResult(${rowIndex}, '${testKey}', this.value, 'res')"
                                class="results-select text-xs ${cellData.res === '+' ? posColor : 'text-slate-500'}"
                            >
                                <option value="-" ${cellData.res === '-' ? 'selected' : ''}>- Neg</option>
                                <option value="+" ${cellData.res === '+' ? 'selected' : ''}>+ Pos</option>
                            </select>
                        </div>
                    </div>
                </td>
            `;
        }

        function updateResult(rowIndex, field, value, subField = null) {
            if (subField) {
                state.resultsData[rowIndex][field][subField] = value;
            } else {
                state.resultsData[rowIndex][field] = value;
            }
        }

        function clearResults() {
            if(confirm('Are you sure you want to clear all results?')) {
                // Use Array.from to generate a completely new array of fresh objects
                // This ensures we don't carry over any reference issues or stale data
                state.resultsData = Array.from({ length: 5 }, () => ({ 
                    food: '', 
                    starch: { obs: '', res: '-' }, 
                    reducingSugar: { obs: '', res: '-' }, 
                    nonReducingSugar: { obs: '', res: '-' }, 
                    lipids: { obs: '', res: '-' }, 
                    protein: { obs: '', res: '-' } 
                }));
                
                renderResultsTable(document.getElementById('app'));
                lucide.createIcons();
            }
        }

        function fillSampleResults() {
            // Accurate A-Level Results
            state.resultsData = [
                {
                    food: 'Bread',
                    starch: { obs: 'Turns Blue-Black', res: '+' },
                    reducingSugar: { obs: 'Slight Green/Yellow', res: '+' }, // Contains some sugar
                    nonReducingSugar: { obs: 'Remains Blue', res: '-' },
                    lipids: { obs: 'Remains Clear', res: '-' },
                    protein: { obs: 'Turns Purple', res: '+' }
                },
                {
                    food: 'Apple Juice',
                    starch: { obs: 'Remains Orange', res: '-' },
                    reducingSugar: { obs: 'Turns Brick Red', res: '+' },
                    nonReducingSugar: { obs: 'Remains Blue', res: '-' },
                    lipids: { obs: 'Remains Clear', res: '-' },
                    protein: { obs: 'Remains Blue', res: '-' }
                },
                {
                    food: 'Sucrose Sol.',
                    starch: { obs: 'Remains Orange', res: '-' },
                    reducingSugar: { obs: 'Remains Blue', res: '-' }, // Key distinction
                    nonReducingSugar: { obs: 'Turns Brick Red', res: '+' }, // After hydrolysis
                    lipids: { obs: 'Remains Clear', res: '-' },
                    protein: { obs: 'Remains Blue', res: '-' }
                },
                {
                    food: 'Vegetable Oil',
                    starch: { obs: 'Remains Orange', res: '-' },
                    reducingSugar: { obs: 'Remains Blue', res: '-' },
                    nonReducingSugar: { obs: 'Remains Blue', res: '-' },
                    lipids: { obs: 'White Emulsion', res: '+' },
                    protein: { obs: 'Remains Blue', res: '-' }
                },
                {
                    food: 'Egg White',
                    starch: { obs: 'Remains Orange', res: '-' },
                    reducingSugar: { obs: 'Remains Blue', res: '-' },
                    nonReducingSugar: { obs: 'Remains Blue', res: '-' },
                    lipids: { obs: 'Remains Clear', res: '-' },
                    protein: { obs: 'Turns Purple', res: '+' }
                }
            ];
            
            renderResultsTable(document.getElementById('app'));
            lucide.createIcons();
        }

        function printWorksheet() {
            const printArea = document.getElementById('print-area');
            
            // Helper to generate one table
            const generateTableHtml = (titleSuffix = "") => {
                const rows = state.resultsData.map((row) => `
                    <tr>
                        <td style="font-weight:bold; background-color: #fafafa;">${row.food || '&nbsp;'}</td>
                        <td>
                            <div><strong>Obs:</strong> ${row.starch.obs || ''}</div>
                            <div><strong>Res:</strong> ${row.starch.res === '+' ? 'Positive' : 'Negative'}</div>
                        </td>
                        <td>
                            <div><strong>Obs:</strong> ${row.reducingSugar.obs || ''}</div>
                            <div><strong>Res:</strong> ${row.reducingSugar.res === '+' ? 'Positive' : 'Negative'}</div>
                        </td>
                        <td>
                            <div><strong>Obs:</strong> ${row.nonReducingSugar.obs || ''}</div>
                            <div><strong>Res:</strong> ${row.nonReducingSugar.res === '+' ? 'Positive' : 'Negative'}</div>
                        </td>
                        <td>
                            <div><strong>Obs:</strong> ${row.lipids.obs || ''}</div>
                            <div><strong>Res:</strong> ${row.lipids.res === '+' ? 'Positive' : 'Negative'}</div>
                        </td>
                        <td>
                            <div><strong>Obs:</strong> ${row.protein.obs || ''}</div>
                            <div><strong>Res:</strong> ${row.protein.res === '+' ? 'Positive' : 'Negative'}</div>
                        </td>
                    </tr>
                `).join('');

                return `
                    <div class="print-container">
                        <div class="print-header">
                            <div>
                                <h2 style="margin:0; font-size: 16px;">A-Level Food Tests Result Log</h2>
                                <div style="margin-top:5px; font-size: 12px;">Student Name: ____________________ &nbsp; Date: __________</div>
                            </div>
                            <div style="text-align:right; font-size: 10px; color: #666;">${titleSuffix}</div>
                        </div>
                        <table class="print-table">
                            <thead>
                                <tr>
                                    <th width="12%">Sample</th>
                                    <th width="17%">Starch</th>
                                    <th width="17%">Reducing Sugar</th>
                                    <th width="20%">Non-Red. Sugar</th>
                                    <th width="17%">Lipids</th>
                                    <th width="17%">Protein</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                        </table>
                    </div>
                `;
            };

            // Inject content into hidden print area
            printArea.innerHTML = `
                ${generateTableHtml("Copy 1")}
                <div class="cut-line"></div>
                ${generateTableHtml("Copy 2")}
            `;

            // Trigger print
            window.print();
        }

        // --- ANIMATION LOGIC ---

        function runSimulation() {
            const config = TESTS[state.activeTab];
            const liquid = document.getElementById('liquid');
            const btn = document.getElementById('btn-test');
            const status = document.getElementById('sim-status');
            const statusText = document.getElementById('status-text');
            const resultBadge = document.getElementById('result-badge');
            const heatSource = document.getElementById('heat-source');

            if (state.isTesting || state.isComplete) return;

            state.isTesting = true;
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            
            // Show Processing Status
            status.classList.remove('opacity-0');
            
            // SPECIAL LOGIC FOR NON-REDUCING SUGARS (Complex Sequence)
            if (config.isComplex) {
                 statusText.innerText = "Adding HCl & Boiling...";
                 if (heatSource) heatSource.classList.remove('opacity-0', 'translate-y-12');

                 setTimeout(() => {
                    statusText.innerText = "Hydrolysing Bonds...";
                    
                    setTimeout(() => {
                        statusText.innerText = "Neutralizing (NaHCO₃)...";
                        if (heatSource) heatSource.classList.add('opacity-0', 'translate-y-12');
                        
                        setTimeout(() => {
                            statusText.innerText = "Testing (Benedict's)...";
                            if (heatSource) heatSource.classList.remove('opacity-0', 'translate-y-12');
                            
                            setTimeout(() => {
                                liquid.classList.add(config.animationClass);
                                statusText.innerText = "Reacting...";
                                setTimeout(() => {
                                    finishSimulation(config);
                                }, 4000);
                            }, 1500);
                        }, 2000);
                    }, 2000);
                 }, 2000);

                 return;
            }

            // STANDARD LOGIC
            if (config.requiresHeat) {
                statusText.innerText = "Heating Sample...";
                // Show flame
                heatSource.classList.remove('opacity-0', 'translate-y-12');
                
                // Delay for "heating"
                setTimeout(() => {
                    statusText.innerText = "Reacting...";
                    liquid.classList.add(config.animationClass);
                    
                    setTimeout(() => {
                        finishSimulation(config);
                    }, 4000); // Wait for animation
                }, 1000);
            } else {
                statusText.innerText = "Reacting...";
                
                // Immediate start of animation
                if (config.animationClass.startsWith('animate-')) {
                    // Keyframe animation
                    liquid.classList.add(config.animationClass);
                } else {
                    // Simple transition
                    liquid.classList.add(config.animationClass); // Add duration class
                    liquid.style.fill = config.positiveResult.colorHex;
                }

                setTimeout(() => {
                    finishSimulation(config);
                }, 1500);
            }
        }

        function finishSimulation(config) {
            const status = document.getElementById('sim-status');
            const resultBadge = document.getElementById('result-badge');
            const heatSource = document.getElementById('heat-source');
            
            state.isTesting = false;
            state.isComplete = true;

            // Hide status and heat
            status.classList.add('opacity-0');
            if (heatSource) heatSource.classList.add('opacity-0', 'translate-y-12');

            // Show Result
            resultBadge.classList.remove('opacity-0', 'scale-90', 'translate-y-4');
        }

        function resetSimulation() {
            const config = TESTS[state.activeTab];
            const liquid = document.getElementById('liquid');
            const btn = document.getElementById('btn-test');
            const resultBadge = document.getElementById('result-badge');
            const heatSource = document.getElementById('heat-source');
            const status = document.getElementById('sim-status');

            // Reset State
            state.isTesting = false;
            state.isComplete = false;
            
            // Reset UI
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            
            resultBadge.classList.add('opacity-0', 'scale-90');
            status.classList.add('opacity-0');
            if (heatSource) heatSource.classList.add('opacity-0', 'translate-y-12');

            // Reset Liquid
            liquid.style.fill = config.reagentColor;
            liquid.classList.remove('animate-glucose', 'animate-lipids');
            // Remove generic duration classes if any
            liquid.classList.remove('duration-1000', 'duration-[2000ms]');
        }

        // Initialize
        init();

    </script>
