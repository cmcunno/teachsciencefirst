<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yeast Respiration Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-100">
    <div
      class="min-h-screen flex flex-col items-center justify-center p-4 lg:p-8 font-sans text-slate-800"
    >
      <div class="w-full max-w-7xl mx-auto">
        <header class="text-center mb-6">
          <h1 class="text-3xl lg:text-4xl font-bold text-slate-900">
            Yeast Respiration Simulation
          </h1>
          <p class="text-slate-600 mt-2">
            Investigating the effect of glucose concentration on the rate of
            respiration.
          </p>
        </header>

        <main
          class="bg-white p-4 sm:p-6 lg:p-8 rounded-2xl shadow-2xl space-y-8"
        >
          <!-- Control Panel -->
          <div
            class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col sm:flex-row items-center justify-center sm:justify-end gap-4 flex-wrap"
          >
            <div class="flex items-center gap-4 sm:gap-6 flex-wrap justify-center">
              <div class="flex items-center gap-3 text-slate-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" />
                </svg>
                <label for="trials-control" class="font-semibold whitespace-nowrap">Repeats:</label>
                <select id="trials-control" class="bg-white border border-slate-300 rounded-md py-1 px-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-slate-200">
                  <option value="1">1</option>
                  <option value="3">3</option>
                  <option value="5">5</option>
                  <option value="7">7</option>
                </select>
              </div>
              <div class="flex items-center gap-3 text-slate-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
                <label for="speed-control" class="font-semibold whitespace-nowrap">Speed:</label>
                <select id="speed-control" class="bg-white border border-slate-300 rounded-md py-1 px-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-slate-200">
                  <option value="1">1x</option>
                  <option value="5">5x</option>
                  <option value="10">10x</option>
                  <option value="50">50x</option>
                </select>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Simulation Display -->
            <div
              class="bg-slate-50 p-4 rounded-xl border border-slate-200"
            >
              <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-800">
                  Experiment Simulation
                </h2>
                <button aria-label="About the simulation" data-modal-target="simulation" class="info-btn text-slate-500 hover:text-blue-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </button>
              </div>
              <div class="flex items-center justify-center gap-4 my-4">
                <button id="start-btn" class="flex items-center gap-2 bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 transition-all duration-200 disabled:bg-slate-400 disabled:cursor-not-allowed">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>
                  <span>Start</span>
                </button>
                <button id="pause-btn" class="flex items-center gap-2 bg-orange-500 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-orange-600 transition-all duration-200 disabled:bg-slate-400 disabled:cursor-not-allowed">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM7 8a1 1 0 011-1h1a1 1 0 110 2H8a1 1 0 01-1-1zm4 0a1 1 0 011-1h1a1 1 0 110 2h-1a1 1 0 01-1-1z" clip-rule="evenodd" /></svg>
                  Pause
                </button>
                <button id="reset-btn" class="flex items-center gap-2 bg-red-500 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-red-600 transition-all duration-200 disabled:bg-slate-400 disabled:cursor-not-allowed">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" /></svg>
                  Reset
                </button>
              </div>
              <div id="simulation-display" class="bg-blue-200/50 border border-blue-300 rounded-lg px-1 py-4 flex justify-center gap-x-1 items-center">
                <!-- Test tubes will be generated by JS -->
              </div>
            </div>
            <div class="space-y-8">
              <!-- Results Table -->
              <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                  <h2 class="text-xl font-bold text-slate-800">Results Table</h2>
                  <button aria-label="About the results table" data-modal-target="table" class="info-btn text-slate-500 hover:text-blue-600 transition-colors">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                      </svg>
                  </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-slate-600">
                        <thead id="results-table-head" class="text-xs text-slate-700 uppercase bg-slate-200">
                            <!-- Header will be generated by JS -->
                        </thead>
                        <tbody id="results-table-body">
                            <!-- Body will be generated by JS -->
                        </tbody>
                    </table>
                </div>
              </div>
              <!-- Results Graph -->
              <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                 <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-slate-800">Results Graph</h2>
                    <div class="flex items-center">
                        <div class="flex items-center bg-slate-200 rounded-lg p-1 text-sm font-semibold mr-2">
                           <button id="graph-mode-time" class="px-3 py-1 rounded-md transition-colors duration-200 bg-white text-blue-600 shadow-sm">
                             Time
                           </button>
                           <button id="graph-mode-rate" class="px-3 py-1 rounded-md transition-colors duration-200 bg-transparent text-slate-600 hover:bg-slate-300/50">
                             Rate
                           </button>
                        </div>
                        <button aria-label="About the results graph" data-modal-target="graph" class="info-btn text-slate-500 hover:text-blue-600 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </button>
                    </div>
                 </div>
                 <div class="w-full h-72">
                   <canvas id="results-graph-canvas"></canvas>
                 </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden" role="dialog" aria-modal="true">
      <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col transform transition-all duration-300 scale-95 opacity-0">
        <header class="flex justify-between items-center p-4 border-b border-slate-200 flex-shrink-0">
          <h3 id="modal-title" class="text-xl font-bold text-slate-800" >Modal Title</h3>
          <button id="modal-close-btn" class="text-slate-500 hover:text-red-600 transition-colors" aria-label="Close dialog">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </header>
        <div id="modal-body" class="p-6 overflow-y-auto">
          <!-- Modal content is injected here -->
        </div>
      </div>
    </div>
    
    <script type="module" src="index.js"></script>
</body>
</html>
