<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pondweed Photosynthesis Simulation</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* General Styles */
        :root {
             --component-transition-duration: 0.3s;
        }
        html { box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            padding-bottom: 50px;
            margin: 0;
            overflow-x: hidden;
            transition: background-color var(--component-transition-duration) ease-in-out;
        }
        body.component-zoomed { background-color: rgba(0, 0, 0, 0.5); }

        h1 {
           text-align: center;
           width: 90%;
           margin-top: 20px;
           margin-bottom: 10px;
           transition: opacity var(--component-transition-duration) ease-in-out;
        }

        /* Main Container */
        .main-content-area {
            display: flex;
            flex-direction: column;
            width: 95%;
            max-width: 1400px;
            gap: 20px;
            margin-top: 10px;
        }

        /* Simulation and Results Containers */
        .simulation-container,
        .results-container {
            border: 1px solid #ccc;
            padding: 20px 20px 30px 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            position: relative;
            flex: 1;
            min-width: 0;
            transition: opacity var(--component-transition-duration) ease-in-out,
                        transform var(--component-transition-duration) ease-in-out;
        }
        .simulation-content-wrapper {
             width: 100%;
             height: 100%;
             transform-origin: top left;
             transition: transform var(--component-transition-duration) ease-in-out;
             /* Adjust padding if scaling causes issues */
             /* padding: 10px; */
         }


        /* Side-by-Side Layout */
        @media (min-width: 1000px) { /* Increased breakpoint slightly */
            .main-content-area { flex-direction: row; align-items: flex-start; }
            .simulation-container,
            .results-container { flex-basis: 48%; min-width: 450px; /* Slightly wider min */ }
        }

        /* --- Zoom Functionality --- */
        .zoom-toggle { /* ... Style as before ... */
            position: absolute; top: 5px; right: 5px; width: 25px; height: 25px; background-color: rgba(0, 0, 0, 0.1); border: 1px solid rgba(0, 0, 0, 0.2); border-radius: 4px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; font-weight: bold; line-height: 1; z-index: 1050; transition: background-color 0.2s ease; user-select: none; }
        .zoom-toggle:hover { background-color: rgba(0, 0, 0, 0.2); }

        .zoomed-component {
            position: fixed !important; top: 5vh !important; left: 5vw !important; width: 90vw !important; height: 90vh !important; z-index: 1000 !important; overflow: auto !important; padding: 20px !important; opacity: 1 !important; transform: scale(1) !important;
        }
        /* Apply scale to inner wrapper when sim is zoomed */
        .simulation-container.zoomed-component .simulation-content-wrapper {
             transform: scale(1); /* Increased scale factor slightly */
             /* width: calc(100% / 1.2); */ /* May not be needed depending on content */
             /* height: calc(100% / 1.5); */
             /* overflow: hidden; */
         }
        .results-container.zoomed-component { padding: 30px; }


        /* Hide others when zoomed */
        body.component-zoomed > h1,
        body.component-zoomed .main-content-area > *:not(.zoomed-component) {
            opacity: 0; pointer-events: none; transform: scale(0.95);
        }


        /* --- Simulation Visuals --- */
        .scene {
            position: relative;
            width: 100%;
            height: 400px; /* *** INCREASED HEIGHT *** */
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            overflow: hidden;
        }
        .lamp {
            position: absolute;
            bottom: 130px; /* Adjusted Y position */
            width: 45px;   /* *** INCREASED SIZE *** */
            height: 45px;  /* *** INCREASED SIZE *** */
            background-color: yellow; border-radius: 50%; border: 2px solid orange; box-shadow: 0 0 15px 5px yellow; z-index: 10; transition: left 0.1s linear;
        }
        .light-beam { /* Adjusted for new lamp position/size */
            position: absolute;
            bottom: -180px; /* Adjusted */
            left: 50%; transform: translateX(-50%); width: 0; height: 0;
            border-left: 50px solid transparent; /* Increased base */
            border-right: 50px solid transparent;/* Increased base */
            border-top: 180px solid rgba(255, 255, 0, 0.3); /* Increased length */
            pointer-events: none; transition: opacity 0.3s ease;
        }
        .beaker {
            position: absolute;
            right: 60px;   /* Adjusted position */
            bottom: 20px;  /* Adjusted position */
            width: 140px;  /* *** INCREASED SIZE *** */
            height: 230px; /* *** INCREASED SIZE *** */
            border: 3px solid #aaa; border-top: none; border-radius: 0 0 10px 10px; background-color: #e0f7ff; display: flex; flex-direction: column; justify-content: flex-end;
        }
        .water { position: relative; height: 90%; width: 100%; background-color: #add8e6; overflow: hidden; border-radius: 0 0 8px 8px; }
        .pondweed { /* Adjusted position within larger beaker */
            position: absolute;
            bottom: 10px; /* Increased bottom */
            left: 50%; transform: translateX(-50%);
            width: 60px; /* Increased size */
            height: 70px;/* Increased size */
            user-select: none; display: flex; justify-content: center; align-items: flex-end;
        }
        .pondweed svg { width: 100%; height: 100%; fill: #2E8B57; stroke: #006400; stroke-width: 1; }
        #bubble-container { /* Adjusted for new pondweed size */
            position: absolute;
            bottom: 80px; /* Increased bottom */
            left: 0; width: 100%;
            height: calc(100% - 80px); /* Adjusted height */
            pointer-events: none;
        }
        .bubble { /* Slightly larger bubbles */
            position: absolute; bottom: 0; left: calc(50% - 4px);
            width: 7px;   /* *** INCREASED SIZE *** */
            height: 7px;  /* *** INCREASED SIZE *** */
            background-color: rgba(255, 255, 255, 0.7); border-radius: 50%; box-shadow: inset 0 0 1px white;
        }
        .distance-line { /* Adjusted vertical position */
            position: absolute;
            bottom: 152px; /* Adjusted (center of lamp height) */
            height: 1px; background-color: #888; border-top: 1px dashed #888; z-index: 1;
        }
        .distance-display { /* Adjusted vertical position */
            position: absolute;
            bottom: 157px; /* Adjusted */
            transform: translateX(-50%); background-color: white; padding: 2px 5px; font-size: 0.9em; color: #333; z-index: 2; white-space: nowrap;
        }
        .controls { margin-top: 20px; width: 100%; display: flex; flex-direction: column; gap: 15px; }
        .control-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .control-group label { min-width: 130px; font-weight: bold; flex-shrink: 0; }
        #distance-slider { flex-grow: 1; min-width: 150px; max-width: 300px; cursor: grab; }
        #distance-slider:active { cursor: grabbing; }
        #distance-slider:disabled { cursor: not-allowed; opacity: 0.6; }
        .display { font-weight: bold; font-size: 1.2em; background-color: #eee; padding: 5px 10px; border-radius: 4px; min-width: 50px; text-align: center; }
        button { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.9em; transition: background-color 0.2s ease; white-space: nowrap; color: white; }
        button:enabled { background-color: #4CAF50; }
        #pause-button:enabled { background-color: #ff9800; }
        #stop-button:enabled { background-color: #f44336; }
        #clear-results-button, #toggle-view-button, #print-results-button { background-color: #607D8B; }
        #clear-results-button:hover:enabled, #toggle-view-button:hover:enabled, #print-results-button:hover:enabled { background-color: #546E7A; }
        button:disabled { background-color: #ccc; color: #666; cursor: not-allowed; }
        button:hover:enabled { opacity: 0.9; }

        /* --- Results Styles --- (No Change Needed) */
        .results-container h2 { margin: 0; text-align: center; flex-grow: 1; }
        .results-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .results-controls > div { display: flex; gap: 10px; flex-shrink: 0; }
        #results-table { width: 100%; border-collapse: collapse; margin-top: 10px; display: table; }
        #results-table th, #results-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        #results-table th { background-color: #f2f2f2; font-weight: bold; }
        #results-table tbody tr:nth-child(even) { background-color: #f9f9f9; }
        #results-chart-container { width: 100%; min-height: 300px; height: 350px; margin-top: 20px; position: relative; display: none; }
        #results-chart { display: block; box-sizing: border-box; height: 100% !important; width: 100% !important; }

    </style>
</head>
<body>
    <h1>Pondweed Photosynthesis Simulation (Inverse Square Law)</h1>

    <div class="main-content-area">
        <!-- Simulation Column -->
        <div class="simulation-container" id="simulation-component">
            <div class="zoom-toggle" id="zoom-toggle-sim" title="Toggle Zoom">↗</div>
             <div class="simulation-content-wrapper">
                <div class="scene">
                  
                    <div id="lamp" class="lamp"><div class="light-beam"></div></div>
                    <div class="beaker">
                        <div class="water">
                            <div id="bubble-container"></div>
                            <div class="pondweed">
                                 <svg viewBox="0 0 50 60"> {/* SVG coordinates remain relative */}
                                    <path d="M 25 60 Q 23 40 25 20 T 25 0" stroke-width="3" fill="none"/>
                                    <path d="M 25 50 C 15 55 10 45 25 45" /> <path d="M 25 50 C 35 55 40 45 25 45" />
                                    <path d="M 25 40 C 18 43 15 37 25 35" /> <path d="M 25 40 C 32 43 35 37 25 35" />
                                    <path d="M 25 30 C 20 32 18 28 25 25" /> <path d="M 25 30 C 30 32 32 28 25 25" />
                                    <path d="M 25 20 C 22 21 20 19 25 15" /> <path d="M 25 20 C 28 21 30 19 25 15" />
                                 </svg>
                            </div>
                        </div>
                    </div>
                    <div id="distance-line" class="distance-line"></div>
                    <div id="distance-display" class="distance-display">10 cm</div>
                </div>
                <div class="controls">
                    <div class="control-group">
                        <label for="distance-slider">Lamp Distance (cm):</label>
                     
                        <input type="range" id="distance-slider" min="10" max="50" value="10" step="1">
                        <span id="slider-value">10 cm</span>
                    </div>
                    <div class="control-group">
                        <label>Timer:</label>
                        <div id="timer-display" class="display">0.0s</div>
                        <button id="start-button">Start</button>
                        <button id="pause-button" disabled>Pause</button>
                        <button id="stop-button" disabled>Stop/Reset</button>
                    </div>
                    <div class="control-group">
                        <label>Bubble Count:</label>
                        <div id="bubble-counter" class="display">0</div>
                    </div>
                </div>
             </div> 
        </div>

  
        <div class="results-container" id="results-component">
             <div class="zoom-toggle" id="zoom-toggle-results" title="Toggle Zoom">↗</div>
             <div class="results-controls">
                <h2>Experiment Results</h2>
                <div>
                    <button id="print-results-button">Print Results</button>
                    <button id="toggle-view-button">Show Graph</button>
                    <button id="clear-results-button">Clear Results</button>
                </div>
            </div>
            <table id="results-table">
                <thead>
                    <tr><th>Distance (cm)</th><th>Bubbles produced in 30 Seconds</th></tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
            <div id="results-chart-container">
                <canvas id="results-chart"></canvas>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements (as before)
            const simulationComponent = document.getElementById('simulation-component');
            const lamp = document.getElementById('lamp');
            const lightBeam = lamp.querySelector('.light-beam');
            const distanceSlider = document.getElementById('distance-slider');
            const sliderValueDisplay = document.getElementById('slider-value');
            const distanceDisplay = document.getElementById('distance-display');
            const distanceLine = document.getElementById('distance-line');
            const timerDisplay = document.getElementById('timer-display');
            const bubbleCounterDisplay = document.getElementById('bubble-counter');
            const startButton = document.getElementById('start-button');
            const pauseButton = document.getElementById('pause-button');
            const stopButton = document.getElementById('stop-button');
            const bubbleContainer = document.getElementById('bubble-container');
            const beaker = document.querySelector('.beaker');
            const scene = document.querySelector('.scene');
            const zoomToggleSim = document.getElementById('zoom-toggle-sim');
            const resultsComponent = document.getElementById('results-component');
            const clearResultsButton = document.getElementById('clear-results-button');
            const toggleViewButton = document.getElementById('toggle-view-button');
            const printResultsButton = document.getElementById('print-results-button');
            const resultsBody = document.getElementById('results-body');
            const resultsTable = document.getElementById('results-table');
            const resultsChartContainer = document.getElementById('results-chart-container');
            const resultsChartCanvas = document.getElementById('results-chart');
            const zoomToggleResults = document.getElementById('zoom-toggle-results');
            const bodyElement = document.body;

            // *** UPDATED Simulation Parameters ***
            const MIN_DISTANCE_CM = 10;
            const MAX_DISTANCE_CM = 50; // Changed from 100
            const MAX_RATE_BUBBLES_PER_SEC = 3;
            const BUBBLE_GENERATION_INTERVAL_MS = 100;
            const MAX_TIME_SEC = 30;
            const BUBBLE_RISE_DURATION_MS = 3000;

            // Simulation State (as before)
            let currentDistanceCm = parseInt(distanceSlider.value);
            let bubbleRate = 0;
            let bubbleCount = 0;
            let timerInterval = null;
            let startTime = 0;
            let elapsedTime = 0;
            let isRunning = false;
            let isPaused = false;
            let bubbles = [];
            let animationFrameId = null;
            let bubbleGenerationInterval = null;
            let resultsData = [];
            let isGraphVisible = false;
            let myChart = null;
            let zoomedComponentId = null;
            let resizeTimeout;


            // --- Helper & Core Simulation Functions ---
            // (No changes needed to the JS logic of these functions
            // based on the distance change, they use the constants)
             function calculateBubbleRate(distanceCm) { /* ... no change ... */
                 if (distanceCm < MIN_DISTANCE_CM) distanceCm = MIN_DISTANCE_CM;
                 const rate = MAX_RATE_BUBBLES_PER_SEC * Math.pow(MIN_DISTANCE_CM / distanceCm, 2);
                 return rate;
             }
             function updateLampAndDistanceVisuals(distanceCm) { /* ... no change ... */
                 requestAnimationFrame(() => {
                     if (!scene || !beaker || !lamp || !distanceLine || !distanceDisplay || !lightBeam) return;
                     const sceneWidth = scene.offsetWidth; if (sceneWidth <= 0) return;
                     const beakerLeftPx = beaker.offsetLeft; const lampWidthPx = lamp.offsetWidth;
                     const leftMargin = 10; const rightMargin = 10;
                     const availableSpacePx = Math.max(0, beakerLeftPx - lampWidthPx - leftMargin - rightMargin);
                     const totalRangeCm = MAX_DISTANCE_CM - MIN_DISTANCE_CM; // Uses the updated constant
                     const distanceRatio = totalRangeCm <= 0 ? 0 : (distanceCm - MIN_DISTANCE_CM) / totalRangeCm;
                     let lampLeftPx = leftMargin + (1 - distanceRatio) * availableSpacePx;
                     lampLeftPx = Math.max(leftMargin, Math.min(beakerLeftPx - lampWidthPx - rightMargin, lampLeftPx));
                     lamp.style.left = `${lampLeftPx}px`;
                     const lampRightPx = lampLeftPx + lampWidthPx;
                     distanceLine.style.left = `${lampRightPx}px`;
                     distanceLine.style.right = `${sceneWidth - beakerLeftPx}px`;
                     const lineMidPx = lampRightPx + (beakerLeftPx - lampRightPx) / 2;
                     distanceDisplay.style.left = `${lineMidPx}px`;
                     distanceDisplay.textContent = `${distanceCm} cm`;
                     const intensityFactor = Math.pow(MIN_DISTANCE_CM / distanceCm, 2);
                     lightBeam.style.opacity = 0.1 + 0.3 * intensityFactor;
                 });
             }
             function createBubble() { /* ... no change ... */
                 if (!isRunning || isPaused) return;
                 const bubble = document.createElement('div'); bubble.classList.add('bubble');
                 bubble.style.left = `calc(${45 + Math.random() * 10}% - 4px)`; // Adjusted for bubble size
                 bubbleContainer.appendChild(bubble);
                 bubbles.push({ element: bubble, startTime: performance.now() });
                 if (!animationFrameId) animationFrameId = requestAnimationFrame(animateBubbles);
             }
             function animateBubbles(currentTime) { /* ... no change ... */
                 if (bubbles.length === 0) { animationFrameId = null; return; }
                 for (let i = bubbles.length - 1; i >= 0; i--) {
                     const bubbleInfo = bubbles[i];
                     if (!bubbleInfo || !bubbleInfo.element || !bubbleContainer.contains(bubbleInfo.element)) { bubbles.splice(i, 1); continue; }
                     const timeElapsed = currentTime - bubbleInfo.startTime;
                     const progress = timeElapsed / BUBBLE_RISE_DURATION_MS;
                     if (progress >= 1) {
                         bubbleContainer.removeChild(bubbleInfo.element); bubbles.splice(i, 1);
                         if (isRunning && !isPaused) { bubbleCount++; bubbleCounterDisplay.textContent = bubbleCount; }
                     } else {
                         bubbleInfo.element.style.bottom = `${progress * 100}%`;
                         const wobble = Math.sin(timeElapsed / 200) * 3; bubbleInfo.element.style.transform = `translateX(${wobble}px)`;
                     }
                 }
                 if (bubbles.length > 0) animationFrameId = requestAnimationFrame(animateBubbles);
                 else animationFrameId = null;
             }
             function updateTimer() { /* ... no change ... */
                 if (!isRunning || isPaused) return; const now = performance.now();
                 elapsedTime = (now - startTime) / 1000;
                 if (elapsedTime >= MAX_TIME_SEC) {
                     elapsedTime = MAX_TIME_SEC; timerDisplay.textContent = `${elapsedTime.toFixed(1)}s`;
                     stopExperiment(true);
                 } else { timerDisplay.textContent = `${elapsedTime.toFixed(1)}s`; }
             }
             function attemptBubbleGeneration() { /* ... no change ... */
                 if (!isRunning || isPaused) return; const probability = bubbleRate * (BUBBLE_GENERATION_INTERVAL_MS / 1000);
                 if (Math.random() < probability) createBubble();
             }
              function startExperiment() { /* ... no change ... */
                if (isRunning) return; isRunning = true; isPaused = false; elapsedTime = 0; bubbleCount = 0;
                bubbleCounterDisplay.textContent = bubbleCount; startTime = performance.now();
                bubbleContainer.innerHTML = ''; bubbles = []; if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
                bubbleRate = calculateBubbleRate(currentDistanceCm);
                clearInterval(timerInterval); clearInterval(bubbleGenerationInterval);
                timerInterval = setInterval(updateTimer, 100); bubbleGenerationInterval = setInterval(attemptBubbleGeneration, BUBBLE_GENERATION_INTERVAL_MS);
                startButton.disabled = true; pauseButton.disabled = false; stopButton.disabled = false; distanceSlider.disabled = true; pauseButton.textContent = "Pause";
             }
             function togglePauseExperiment() { /* ... no change ... */
                 if (!isRunning) return; if (isPaused) { isPaused = false; startTime = performance.now() - (elapsedTime * 1000); pauseButton.textContent = "Pause"; distanceSlider.disabled = true; if (!timerInterval) timerInterval = setInterval(updateTimer, 100); if (!bubbleGenerationInterval) bubbleGenerationInterval = setInterval(attemptBubbleGeneration, BUBBLE_GENERATION_INTERVAL_MS); if (bubbles.length > 0 && !animationFrameId) animationFrameId = requestAnimationFrame(animateBubbles); } else { isPaused = true; clearInterval(timerInterval); clearInterval(bubbleGenerationInterval); timerInterval = null; bubbleGenerationInterval = null; pauseButton.textContent = "Resume"; distanceSlider.disabled = false; }
             }
            function stopExperiment(finishedNormally = false) { /* ... no change ... */
                if (!isRunning && !isPaused) return; const finalDistance = currentDistanceCm; const finalBubbleCount = bubbleCount;
                isRunning = false; isPaused = false; clearInterval(timerInterval); clearInterval(bubbleGenerationInterval); timerInterval = null; bubbleGenerationInterval = null;
                addResultToTableAndData(finalDistance, finalBubbleCount);
                elapsedTime = 0; timerDisplay.textContent = "0.0s";
                startButton.disabled = false; pauseButton.disabled = true; stopButton.disabled = true; distanceSlider.disabled = false; pauseButton.textContent = "Pause";
            }
            function addResultToTableAndData(distance, count) { /* ... no change ... */
                const row = resultsBody.insertRow(); row.insertCell(0).textContent = distance; row.insertCell(1).textContent = count;
                resultsData.push({ x: distance, y: count }); resultsData.sort((a, b) => a.x - b.x);
                sortTableRows(); if (isGraphVisible) generateGraph();
            }
            function sortTableRows() { /* ... no change ... */
                const rows = Array.from(resultsBody.querySelectorAll('tr')); if (rows.length <= 1) return;
                rows.sort((rowA, rowB) => { const distanceA = parseFloat(rowA.cells[0].textContent); const distanceB = parseFloat(rowB.cells[0].textContent); return distanceA - distanceB; });
                rows.forEach(row => resultsBody.appendChild(row));
            }
            function clearResults() { /* ... no change ... */
                resultsBody.innerHTML = ''; resultsData = [];
                if (myChart) { myChart.destroy(); myChart = null; }
                if (isGraphVisible) generateGraph();
             }

            // --- Graphing Function ---
            // *** UPDATED Graph X-axis max ***
            function generateGraph() {
                if (myChart) myChart.destroy();
                if (!resultsChartCanvas) return;
                const ctx = resultsChartCanvas.getContext('2d');
                myChart = new Chart(ctx, {
                    type: 'scatter',
                    data: { datasets: [{ label: `Bubbles produced in ${MAX_TIME_SEC} sec vs Distance`, data: resultsData, backgroundColor: 'rgba(75, 192, 192, 0.6)', borderColor: 'rgba(75, 192, 192, 1)', showLine: true, tension: 0.1 }] },
                    options: {
                        scales: {
                            x: {
                                type: 'linear', position: 'bottom',
                                title: { display: true, text: 'Distance (cm)' },
                                min: 0,
                                max: MAX_DISTANCE_CM // *** Uses the updated constant (50) ***
                            },
                            y: { title: { display: true, text: `Bubbles produced in ${MAX_TIME_SEC} Seconds` }, beginAtZero: true }
                        },
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                             legend: { display: false },
                             tooltip: { callbacks: { label: function(context) { let label = `Bubbles/ ${MAX_TIME_SEC}s: ` ; if (context.parsed.y !== null) { label += `${context.parsed.y} at ${context.parsed.x} cm`; } return label; } } }
                         }
                    }
                });
                 if (resultsChartContainer.offsetParent !== null) { setTimeout(() => { if(myChart) myChart.resize(); }, 50); }
             }

             // --- Other Functions (toggleResultsView, toggleZoom, printResults, handleResize, debounce) ---
             // (No changes needed in these functions)
             function toggleResultsView() { /* ... no change ... */
                 isGraphVisible = !isGraphVisible; if (isGraphVisible) { resultsChartContainer.style.display = 'block'; toggleViewButton.textContent = 'Hide Graph'; generateGraph(); } else { resultsChartContainer.style.display = 'none'; toggleViewButton.textContent = 'Show Graph'; }
             }
             function toggleZoom(componentElement) { /* ... no change ... */
                 const targetId = componentElement.id; const zoomButton = componentElement.querySelector('.zoom-toggle'); if (zoomedComponentId === targetId) { componentElement.classList.remove('zoomed-component'); bodyElement.classList.remove('component-zoomed'); zoomButton.textContent = '↗'; zoomButton.title = "Zoom In"; zoomedComponentId = null; setTimeout(debouncedResizeHandler, parseFloat(getComputedStyle(componentElement).transitionDuration || '0.3s') * 1000 + 50); } else { if (zoomedComponentId && zoomedComponentId !== targetId) { const currentlyZoomed = document.getElementById(zoomedComponentId); const currentZoomButton = currentlyZoomed.querySelector('.zoom-toggle'); currentlyZoomed.classList.remove('zoomed-component'); if(currentZoomButton) { currentZoomButton.textContent = '↗'; currentZoomButton.title = "Zoom In"; } } componentElement.classList.add('zoomed-component'); bodyElement.classList.add('component-zoomed'); zoomButton.textContent = '↙'; zoomButton.title = "Zoom Out"; zoomedComponentId = targetId; setTimeout(debouncedResizeHandler, parseFloat(getComputedStyle(componentElement).transitionDuration || '0.3s') * 1000 + 50); }
             }
            function printResults() { /* ... no change ... */
